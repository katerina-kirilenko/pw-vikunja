name: Allure Report

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  # ручной запуск
  workflow_dispatch:

env:
  ALLURE_ENDPOINT: ${{ secrets.ALLURE_ENDPOINT }}
  ALLURE_PROJECT_ID: ${{ secrets.ALLURE_PROJECT_ID }}
  ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}

jobs:
  e2e:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout кода из репозитория
      - uses: actions/checkout@v4

      # 2. Настройка Node.js
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # 3. Установка зависимостей
      - name: Install dependencies
        run: npm install

      # 4. Установка Playwright
      - name: Install Playwright
        run: npx playwright install --with-deps

      # 5. Запуск тестов Playwright
      - name: Run Playwright tests
        run: npx playwright test

      # 6. Сохранение отчетов Playwright
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: test-results
          path: test-results
          retention-days: 20

      # 7. Сохранение отчетов Allure
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: allure-results
          path: allure-results
          retention-days: 20

      # 8. Забрать результаты предыдущего запуска
      - name: Checkout repository
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      # 9. Генерация Allure отчёта
      - uses: simple-elf/allure-report-action@master
        if: always()
        id: allure-report
        with:
          allure_results: allure-results
          gh_pages: gh-pages
          allure_report: allure-report
          keep_reports: 20

      # 10. Deploy отчёта на gh-pages
      - name: Deploy report
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

      # 11. Устанавливаем allurectl
      - name: Setup Allure TestOps CLI
        uses: allure-framework/setup-allurectl@v1
        with:
          allure-endpoint: ${{ secrets.ALLURE_ENDPOINT }}
          allure-token: ${{ secrets.ALLURE_TOKEN }}
          allure-project-id: ${{ secrets.ALLURE_PROJECT_ID }}

      # 12. Запускаем вотчер allurectl
      - name: Run tests and upload to Allure TestOps
        run: |
          allurectl watch \
            --allure.endpoint=${{ env.ALLURE_ENDPOINT }} \
            --allure.token=${{ env.ALLURE_TOKEN }} \
            --allure.project-id=${{ env.ALLURE_PROJECT_ID }} \
            -- \
            npm test 
